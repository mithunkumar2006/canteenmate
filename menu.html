<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canteen Mate</title>
  <link rel="stylesheet" href="menu.css" />
  <style>
    nav a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: #ff9f43;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="canteenlogo.jpeg" alt="Logo" />
    </div>
    <h1 id="head">Canteen Mate</h1>
    <nav>
      <a href="#profile">Profile</a>
      <a href="#orders">Orders</a>
      <a href="cart.html">Cart 🛒</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <div class="hero-section">
    <div class="logo-circle">
      <img src="canteenlogo.jpeg" alt="ritlogo" class="taco-icon">
      <div class="text-bottom">“Fuel Your Day, One Bite Away”</div>
    </div>
  </div>

  <!-- Menu Section -->
  <div class="menu-section">
    <h2>Our Menu</h2>

    <!-- Search Bar -->
    <input type="text" id="searchBar" placeholder="Search menu..." onkeyup="filterMenu()">

    <div class="menu-items" id="menuItems">
      <button type="button" onclick="window.location.href='menudesert.html'" class="menu-item">🍔 Deserts</button>
      <button type="button" onclick="window.location.href='menubreak.html'" class="menu-item">🌮 Break Fast</button>
      <button type="button" onclick="window.location.href='menulunch.html'" class="menu-item">🥗 Lunch</button>
      <button type="button" onclick="window.location.href='menucantina.html'" class="menu-item">🍕 Cantina De Naples</button>
      <button type="button" onclick="window.location.href='menujuice.html'" class="menu-item">🥤 Fruits and juice corner</button>
      <button type="button" onclick="window.location.href='menusnaks.html'" class="menu-item">🥟 Calcutta in a box</button>
    </div>
  </div>

  <script>
    function filterMenu() {
      const input = document.getElementById("searchBar").value.toLowerCase();
      const items = document.querySelectorAll(".menu-item");

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(input) ? "block" : "none";
      });
    }
  </script>
</body>
</html>
